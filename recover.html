<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กู้ข้อมูลสำรอง · 02._.mock</title>
  <style>
    body{margin:0;background:#f0ece4;color:#111;font-family:-apple-system,BlinkMacSystemFont,'IBM Plex Sans Thai',sans-serif;padding:32px;line-height:1.65}
    .card{max-width:680px;margin:0 auto;background:#fffdf9;border:1px solid #d8d0c2;border-radius:16px;padding:26px}
    h1{font-size:24px;margin:0 0 8px}p{color:#6e685d;font-size:14px}
    pre{white-space:pre-wrap;background:#f7f3eb;padding:12px;border-radius:8px;font-size:12px;overflow:auto}
    button{background:#111;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
    button:disabled{opacity:.4;cursor:not-allowed}.warn{color:#9b2c1f;font-size:12px}
  </style>
</head>
<body>
<div class="card">
  <h1>กู้ข้อมูลสำรองจากเบราว์เซอร์</h1>
  <p>หน้านี้จะอ่านข้อมูลที่ค้างอยู่ในเบราว์เซอร์เครื่องนี้ และดาวน์โหลดเป็นไฟล์ JSON เท่านั้น ไม่ได้แก้ไขฐานข้อมูลหรือข้อมูลในเครื่อง</p>
  <pre id="summary">กำลังอ่านข้อมูล...</pre>
  <p class="warn">ห้ามปิดแท็บเก่าที่มีข้อมูลอยู่ก่อนดาวน์โหลดเสร็จ</p>
  <button id="download" disabled>ดาวน์โหลดไฟล์ข้อมูลสำรอง</button>
  <p id="filename"></p>
</div>
<script>
  const keys = ['examio_demo_db_v2','examio_demo_session_v2','examio_notice_reads_v1'];
  const data = {};
  let db = null;
  for (const key of keys) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) continue;
      data[key] = raw;
      if (key === 'examio_demo_db_v2') {
        try { db = JSON.parse(raw); } catch {}
      }
    } catch {}
  }
  const summary = document.getElementById('summary');
  if (!data.examio_demo_db_v2) {
    summary.textContent = 'ไม่พบข้อมูลสำรองในเบราว์เซอร์นี้ (localStorage ว่างหรือถูกล้างไปแล้ว)';
  } else {
    summary.textContent = JSON.stringify({
      students: Array.isArray(db?.students) ? db.students.length : null,
      teachers: Array.isArray(db?.teachers) ? db.teachers.length : null,
      exams: Array.isArray(db?.exams) ? db.exams.length : null,
      attempts: Array.isArray(db?.attempts) ? db.attempts.length : null,
      savedAt: new Date().toISOString()
    }, null, 2);
    document.getElementById('download').disabled = false;
  }
  document.getElementById('download').addEventListener('click', () => {
    const payload = JSON.stringify({ recoveredAt: new Date().toISOString(), source: location.origin, data }, null, 2);
    const blob = new Blob([payload], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `02mock-recovery-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    document.getElementById('filename').textContent = 'ดาวน์โหลดแล้ว: ' + a.download;
  });
</script>
</body>
</html>
