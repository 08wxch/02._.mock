<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="02._.mock — ระบบสอบออนไลน์สำหรับครูและนักเรียน สร้างชุดสอบ เปิดห้องสอบ ตรวจคำตอบ และประกาศผลได้ในที่เดียว">
  <title>02._.mock — ระบบสอบออนไลน์</title>
  <link rel="icon" href="./Circle.jpg">
  <link rel="apple-touch-icon" href="./Circle.jpg">
  <link rel="preload" href="./assets/fonts/kanit-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/ibm-plex-sans-thai-400-thai.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/ibm-plex-sans-thai-600-thai.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./assets/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="./assets/styles.css?v=20261111c">
</head>
<body>
  <div id="app">
    <div class="page-loader"><span class="spinner"></span></div>
  </div>
  <div id="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>
  <noscript><div style="padding:40px;text-align:center;font-family:sans-serif">เว็บไซต์นี้ต้องเปิดใช้งาน JavaScript</div></noscript>
  <script src="./assets/vendor/supabase.js"></script>
  <script src="./app-bundle.js?v=20261111d"></script>
  <script>
    (function () {
      function showBootError(message) {
        var app = document.getElementById('app');
        if (!app || !document.querySelector('.page-loader')) return;
        var box = document.getElementById('boot-error');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'boot-error';
          box.style.cssText = 'position:relative;z-index:5;margin:24px auto;max-width:760px;padding:16px;border-radius:10px;background:#fff3f0;color:#9b2c1f;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;text-align:left;overflow:auto';
          app.appendChild(box);
        }
        box.textContent += message + '\n';
      }
      window.addEventListener('error', function (event) {
        showBootError('JS error: ' + (event.message || 'unknown') + (event.filename ? '\n' + event.filename + ':' + event.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (event) {
        showBootError('Promise error: ' + (event.reason && (event.reason.stack || event.reason.message) || event.reason || 'unknown'));
      });
    })();
  </script>
  <script>
    setTimeout(function () {
      var loader = document.querySelector('.page-loader');
      if (!loader) return;
      var note = document.createElement('div');
      note.style.cssText = 'margin-top:14px;font:12px/1.6 sans-serif;color:#666;text-align:center';
      note.innerHTML = 'โหลดนานกว่าปกติ <a href="./?fresh=1" style="text-decoration:underline;color:inherit">ลองโหลดใหม่</a>';
      loader.appendChild(note);
    }, 10000);
  </script>
</body>
</html>
